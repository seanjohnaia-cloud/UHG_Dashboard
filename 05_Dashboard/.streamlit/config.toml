[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0E85C0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#16191d"
borderColor = "#e2e6ea"
linkColor = "#0E85C0"
linkUnderline = false
baseRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#f4f6f8"
dataframeBorderColor = "#e2e6ea"
chartCategoricalColors = ["#0E85C0", "#16191d", "#57606a", "#1a7f37", "#bf8700", "#cf222e"]
greenColor = "#1a7f37"
redColor = "#cf222e"
orangeColor = "#bf8700"
grayColor = "#57606a"

[theme.sidebar]
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#e9edf1"
